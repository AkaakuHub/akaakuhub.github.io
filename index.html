<!doctype html>
<html lang="ja" class="h-full overflow-hidden bg-[#111a18] font-sans text-[#303b33] antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e7e4db" />
    <link rel="stylesheet" href="/src/tailwind.css" />
    <meta
      name="description"
      content="AkaakuHubの部室。ホワイトボードを眺めたり、部屋を見回したり。"
    />
    <title>AkaakuHub — 部室</title>
  </head>
  <body class="m-0 h-full w-full overflow-hidden">
    <div id="app" class="h-full w-full overflow-hidden">
      <div class="loading" role="status" aria-live="polite">
        <div class="loading-content">
          <h1 class="loading-title">AkaakuHub</h1>
          <span data-loading-label class="sr-only">部室を読み込んでいます</span>
          <progress
            data-loading-progress
            aria-label="読み込みの進捗"
            class="loading-progress"
          ></progress>
          <button data-loading-retry class="loading-retry" hidden>再読み込み</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
