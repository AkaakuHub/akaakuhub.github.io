<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://avatars.githubusercontent.com" crossorigin />
    <meta name="theme-color" content="#edf0e5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141c19" media="(prefers-color-scheme: dark)" />
    <!-- loading-styles -->
    <meta
      name="description"
      content="あかあくの部室。つくったものや、ブログの記事をホワイトボードから。"
    />
    <title>AkaakuHub — 部室</title>
  </head>
  <body>
    <div id="app">
      <section class="loading" aria-label="部室を読み込んでいます">
        <div class="loading-fog" aria-hidden="true"></div>
        <div class="loading-center">
          <div class="loading-readout">
            <span data-loading-percent class="loading-number" aria-hidden="true"
              ><span data-loading-digit hidden></span><span data-loading-digit></span
              ><span data-loading-digit>0</span><span data-loading-digit>.</span
              ><span data-loading-digit>0</span><span data-loading-digit>0</span
              ><span>%</span></span
            >
          </div>
        </div>
        <footer class="loading-footer">
          <progress
            data-loading-progress
            max="1"
            value="0"
            aria-label="部室の準備"
            class="loading-progress"
          ></progress>
          <noscript><p>3Dの部室を開くにはJavaScriptを有効にしてください。</p></noscript>
        </footer>
      </section>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
